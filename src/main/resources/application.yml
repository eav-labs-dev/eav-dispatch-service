spring:
  application:
    name: eav-dispatch-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/eav_dispatch}
    username: ${DATABASE_USERNAME:eav_user}
    password: ${DATABASE_PASSWORD:eav_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

info:
  app:
    version: ${APP_VERSION:0.1.0-SNAPSHOT}
