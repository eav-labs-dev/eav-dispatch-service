spring:
  application:
    name: eav-dispatch-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/eav_dispatch}
    username: ${DATABASE_USERNAME:eav_user}
    password: ${DATABASE_PASSWORD:eav_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    version: ${APP_VERSION:0.1.0-SNAPSHOT}
