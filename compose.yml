services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eav_dispatch
      POSTGRES_USER: eav_user
      POSTGRES_PASSWORD: eav_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eav_user -d eav_dispatch"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - dispatch-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/eav_dispatch
      DATABASE_USERNAME: eav_user
      DATABASE_PASSWORD: eav_password
      APP_VERSION: 0.1.0-SNAPSHOT
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  dispatch-postgres:
